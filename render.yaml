services:
  - type: web
    name: bill-management
    env: node
    plan: free
    buildCommand: npm install && cd client && npm install --include=dev && npm run build && cd ../server && npm install && npm rebuild better-sqlite3
    startCommand: cd server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.10.0"
